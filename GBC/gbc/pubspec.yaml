name: gbc
description: "A new Flutter project."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.12.1

dependencies:
  flutter:
    sdk: flutter

  # --- Networking (talks directly to Supabase's REST/Auth endpoints) ---
  dio: ^5.10.0

  # --- State management ---
  flutter_bloc: ^9.1.1
  equatable: ^2.1.0

  # --- Secure token storage (access_token / refresh_token from Supabase Auth) ---
  flutter_secure_storage: ^9.2.2

  # --- OAuth (Google / Discord) browser redirect + deep-link callback ---
  flutter_web_auth_2: ^4.1.0

  # --- UI helpers ---
  cached_network_image: ^3.4.1
  timeago: ^3.6.1
  image_picker: ^1.1.2
  cupertino_icons: ^1.0.8
  smooth_page_indicator: ^2.0.1
  simple_icons: ^16.23.0
  shared_preferences: ^2.5.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/img/